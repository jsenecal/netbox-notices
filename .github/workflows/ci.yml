name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'renovate.json'
      - '.github/dependabot.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/publish.yml'
      - '.github/workflows/release-drafter.yml'
      - '.github/workflows/pr-title.yml'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'renovate.json'
      - '.github/dependabot.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/publish.yml'
      - '.github/workflows/release-drafter.yml'
      - '.github/workflows/pr-title.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check notices tests
      - run: uv run ruff format --check notices tests

  test:
    name: Test (Python ${{ matrix.python }}, NetBox ${{ matrix.netbox }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # for Codecov OIDC upload
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        netbox:
          # renovate: datasource=github-releases depName=netbox-community/netbox
          - "4.5.10"
          # renovate: datasource=github-releases depName=netbox-community/netbox
          - "4.6.9"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: netbox
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Clone NetBox v${{ matrix.netbox }}
        run: |
          git clone --depth 1 --branch v${{ matrix.netbox }} \
            https://github.com/netbox-community/netbox.git /tmp/netbox

      - name: Configure NetBox
        run: |
          cat > /tmp/netbox/netbox/netbox/configuration.py << 'EOF_CFG'
          ALLOWED_HOSTS = ["*"]

          DATABASES = {
              "default": {
                  "ENGINE": "django.db.backends.postgresql",
                  "NAME": "netbox",
                  "USER": "netbox",
                  "PASSWORD": "ci-password",
                  "HOST": "localhost",
                  "PORT": "5432",
                  "CONN_MAX_AGE": 300,
              }
          }

          REDIS = {
              "tasks":   {"HOST": "localhost", "PORT": 6379, "PASSWORD": "", "DATABASE": 0, "SSL": False},
              "caching": {"HOST": "localhost", "PORT": 6379, "PASSWORD": "", "DATABASE": 1, "SSL": False},
          }

          SECRET_KEY = "ci-only-secret-key-do-not-use-in-production-aaaaaaaaaaaaaaaaaaaa"

          # NetBox refuses to save a v2 API token unless a pepper is configured;
          # its own configuration_testing.py defines one for exactly this reason.
          API_TOKEN_PEPPERS = {
              1: "ci-only-test-pepper-do-not-use-in-production-aaaaaaaaaaaaaaaaaaaa",
          }

          PLUGINS = ["notices"]
          PLUGINS_CONFIG = {"notices": {}}
          EOF_CFG

      - name: Install plugin and NetBox dependencies
        run: |
          uv venv
          uv pip install -r /tmp/netbox/requirements.txt
          uv pip install -e ".[dev]"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"

      - name: Run migrations
        env:
          PYTHONPATH: /tmp/netbox/netbox
          DJANGO_SETTINGS_MODULE: netbox.settings
          NETBOX_CONFIGURATION: netbox.configuration
        run: |
          cd /tmp/netbox/netbox
          python manage.py migrate --noinput

      - name: Run pytest with coverage
        env:
          PYTHONPATH: /tmp/netbox/netbox
          DJANGO_SETTINGS_MODULE: netbox.settings
          NETBOX_CONFIGURATION: netbox.configuration
        run: |
          pytest tests/ -v --tb=short --cov=notices --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python == '3.13' && startsWith(matrix.netbox, '4.6.')
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          # Fork PRs cannot read the secret, so a failed upload there is
          # expected and must not redden the build. Everywhere else a
          # rejected upload is a real problem: it silently stops the
          # coverage gate from voting, which is how tokenless uploads
          # rotted unnoticed.
          fail_ci_if_error: ${{ github.event.pull_request.head.repo.fork != true }}

      - name: Check migrations
        env:
          PYTHONPATH: /tmp/netbox/netbox
          DJANGO_SETTINGS_MODULE: netbox.settings
          NETBOX_CONFIGURATION: netbox.configuration
        run: |
          cd /tmp/netbox/netbox
          python manage.py makemigrations --check --dry-run

      - name: Django system check
        env:
          PYTHONPATH: /tmp/netbox/netbox
          DJANGO_SETTINGS_MODULE: netbox.settings
          NETBOX_CONFIGURATION: netbox.configuration
        run: |
          cd /tmp/netbox/netbox
          python manage.py check

  build:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
